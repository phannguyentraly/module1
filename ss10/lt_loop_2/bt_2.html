<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  let num = +prompt("Nhập số nguyên dương");
  let giaiThua = 1;
  for(let i =1; i <= num; i++){
    giaiThua *= i;
  }alert(`Giai thừa của ${num} là ${giaiThua} `);
</script>
</body>
</html>
