<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<input type="number" id="month">
<button id="count" onclick="soNgay()">Tính số ngày</button> <br>
<p id="result"></p>
<script>
    function soNgay() {
        let thang = +document.getElementById("month").value;
        switch(thang){
            case 1:
            case 3:
            case 5:
            case 7:
            case 8:
            case 10:
            case 12:
                document.getElementById("result").innerHTML=`Tháng ${thang} có 31 ngày`;
                break;
            case 2:
                document.getElementById("result").innerHTML=`Tháng ${thang} có 28 hoặc 29 ngày`;
                break;
            case 4:
            case 6:
            case 9:
            case 11:
                document.getElementById("result").innerHTML=`Tháng ${thang} có 30 ngày`;
                break;
            default:
                document.getElementById("result").innerHTML="Không phải tháng hợp lệ";
        }
    }
</script>
</body>
</html>
