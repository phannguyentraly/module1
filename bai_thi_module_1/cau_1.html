<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let n;
    do {
        n = +prompt("Nhập số phần tử mảng");
    } while (n > 20 || n % 1 !== 0 || n < 0);

    let arr = new Array(n);
    for (let i = 0; i < n; i++) {
        do {
            arr[i] = +prompt(`Nhập số nguyên thứ ${i + 1}`);
        } while (arr[i] % 1 !== 0);
    }
    alert(arr);
    let result = 0;
    for (let i = 0; i < n; i++) {
        if (arr[i] % 2 == 0) {
            result += arr[i];
        } else {
            result -= arr[i];
        }
    }
    alert(result);
</script>
</body>
</html>
