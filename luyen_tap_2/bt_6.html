<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function check() {
        let check = 0;
        let n = +prompt("Nhập số:");
        if (n % 1 == 0) {
            if (n > 0) {
                check = true;
                alert(check);
            } else {
                check = false;
                alert(check);
            }
        } else {
            check = false;
            alert(check);
        }
    }

    check();
</script>
</body>
</html>
