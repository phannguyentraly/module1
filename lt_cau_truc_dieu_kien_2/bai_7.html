<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  let a = +prompt("Nhập a: ");
  let b = +prompt("Nhập b: ");
  let c = +prompt("Nhập c: ");
  let delta = b ** 2 - 4 * a * c;
  if (delta < 0) {
    alert("Phương trình vô nghiệm");
  } else if (delta == 0) {
    x = -b/(2 * a);
    alert(`Phương trình có 1 nghiệm là ${x}`);
  } else {
    x1 = (-b - delta ** (1 / 2)) / (2 * a);
    x2 = (-b + delta ** (1 / 2)) / (2 * a);
    alert(`Phương trình có 2 nghiệm là ${x1} và ${x2}`);
  }
</script>
</body>
</html>
