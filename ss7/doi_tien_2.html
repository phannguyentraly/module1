<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <label><b>Amount</b></label>
    <label><b>From currency</b></label>
    <label><b>To currency</b></label> <br>
    <input id="tien">
    <select id="from">
        <option>USD</option>
        <option>VND</option>
    </select>
    <select id="to">
        <option>VND</option>
        <option>USD</option>
    </select>
    <button onclick="convert()">Convert</button><br>
<p id="result"></p>
<script>
    function convert(){
        const tiGia = 26.075;
        let tien = +document.getElementById("tien").value;
        let from = document.getElementById("from").value;
        let to = document.getElementById("to").value;
        if (from == "USD"&& to == "VND"){
            document.getElementById("result").innerHTML = "Result: "+(tien*tiGia)+" VND";
        };
        if (from =="VND" && to =="USD"){
            document.getElementById("result").innerHTML = "Result: "+(tien/tiGia)+" USD";
        };
        if (from ==to){
            document.getElementById("result").innerHTML = "Result: "+ tien + from;
        };
    }
</script>
</body>
</html>
