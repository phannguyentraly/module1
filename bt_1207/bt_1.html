<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function checkInteger() {
        let n = +prompt("Có bao nhiêu số trong mảng");
        let array = new Array(n);
        let countEven = 0;
        for (let i = 0; i < n; i++) {
            array[i] = +prompt(`Nhập số nguyên thứ ${i + 1}`);
            while (array[i] % 1 != 0) {
                array[i] = +prompt(`Nhập lại số nguyên thứ ${i + 1}`);
            }
            if (array[i] % 2 == 0) {
                countEven++;
            }
        }
        if (countEven == 0) {
            alert("0");
        } else if (countEven == array.length) {
            alert("1");
        } else {
            alert("-1");
        }
    }

    checkInteger();
</script>
</body>
</html>
