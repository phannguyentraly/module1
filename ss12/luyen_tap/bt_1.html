<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let array = new Array(10);
    for (let i = 0; i < 10; i++) {
        array[i] = +prompt(`Số nguyên thứ ${i} là: `)
    }
    let count = 0;
    for (let i = 0; i < 10; i++) {
        if (array[i] >= 10) {
            count++;
        }
    }
    alert(`Có ${count} số nguyên lớn hơn hoặc bằng 10`);
</script>
</body>
</html>
