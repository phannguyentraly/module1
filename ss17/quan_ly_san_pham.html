<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Product Manager</h2>
<input id="id" placeholder="Enter ID">
<input id="name" placeholder="Enter name">
<input id="price" placeholder="Enter price">
<button onclick="addNew()"><b>Add new product</b></button>
<br>
<p id="display"></p>
<script>
    class Product {
        constructor(id, name, price) {
            this.id = id;
            this.name = name;
            this.price = price;
        }
    }

    let product1 = new Product(1, "Samsung", 100);
    let product2 = new Product(2, "Iphone", 200);
    let product3 = new Product(3, "Nokia", 300);
    let productList = [product1, product2, product3];

    // hàm nhập product
    function addNew() {
        let id = document.getElementById("id").value;
        let name = document.getElementById("name").value;
        let price = document.getElementById("price").value;
        let newProduct = new Product(id, name, price);
        productList.push(newProduct);
        document.getElementById("id").value = "";
        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        showList(productList);
    }

    function deleteProduct(index) {
        let conf = ("Bạn có muốn xoá sản phẩm " + productList[index].name + " không?");
        if (conf) {
            productList.splice(index, 1);
        }
        showList(productList);
    }

    function edit(index) {
        let updateProduct = prompt("Nhập tên mới cho " + productList[index].name);
        productList[index].name = updateProduct;
        showList(productList);
    }

    function showList(list) {
        let tableString = `<table border="1" style="border-collapse: collapse;">
                                <tr>
                                        <th>No</th>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Price</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                </tr>`
        for (let i = 0; i < list.length; i++) {
            tableString += `<tr>
                                    <td>${i + 1}</td>
                                    <td>${list[i].id}</td>
                                    <td>${list[i].name}</td>
                                    <td>${list[i].price}</td>
                                    <td><button onclick="edit(${i})">Edit</button></td>
                                    <td><button onclick="deleteProduct(${i})">Delete</button></td>
                                </tr>`
        }
        tableString += `</table>`
        document.getElementById("display").innerHTML = tableString;
    }

    showList(productList);
</script>
</body>
</html>
