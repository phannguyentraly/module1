<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  let money = +prompt("Số tiền gửi vào: ");
  let interestRate = +prompt("Lãi hàng tháng(%): ");
  let month = +prompt("Thời gian gửi ngân hàng: ");
  let total = money*((1+interestRate)**month);
  alert(`Tổng tiền nhận được sau ${month} tháng gửi ngân hàng: ${total}`);
</script>
</body>
</html>
