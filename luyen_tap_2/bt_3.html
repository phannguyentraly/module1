<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function calculate() {
        let n = +prompt("Nhập số cần tính giai thừa:");
        let result = 1;
        for (let i = 1; i <= n; i++) {
            result *= i;
        }
        alert(`Giai thừa của ${n} là ${result}`);
    }
    calculate();
</script>
</body>
</html>
