<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function isPrime() {
        let number = +prompt("Nhập số: ");
        if (number < 2) {
            alert("Không phải số nguyên tố");
            return;
        }
        let count = 0;
        for (let i = 2; i <= number; i++) {
            if (number % i == 0) {
                count++;
            }
        }
        if (count = 1) {
            alert(`${number} là số nguyên tố`);
        } else {
            alert(`${number} không phải số nguyên tố`);
        }
    }

    isPrime();
</script>
</body>
</html>
