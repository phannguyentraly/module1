<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let n;
    do {
        n = +prompt("Nhập số phần tử của mảng");
    } while (n % 3 !== 0 && 3 < n < 15);
    let array = new Array(n);
    for (let i = 0; i < array.length; i++) {
        array[i] = +prompt(`Nhập phần tử thứ ${i + 1}`);
    }
    alert(array);
    let check = true;
    for (let i = 0; i < array.length; i += 3) {
        if (array[i] + array[i + 1] < array[i + 2] || array[i] + array[i + 2] < array[i + 1] || array[i + 1] + array[i + 2] < array[i]) {
            check = false;
            break;
        } else {
            if (array[i] ** 2 + array[i + 1] ** 2 === array[i + 2] ** 2 || array[i] ** 2 + array[i + 2] ** 2 === array[i + 1] ** 2 || array[i + 2] ** 2 + array[i + 1] ** 2 === array[i] ** 2) {
                check = true;
            } else {
                check = false;
                break;
            }
        }
    }
    if (check) {
        alert("OK");
    } else {
        alert("NO");
    }
</script>
</body>
</html>
