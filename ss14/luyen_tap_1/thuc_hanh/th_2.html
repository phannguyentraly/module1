<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1><b>Temperature converter</b></h1>
<p>Type a value in Fahrenheit field to convert the value to Celcius: </p><br>
<label>Fahrenheit:</label>
<input id="doF" type="number"
       oninput=convert(this.value);
       onchange=convert(this.value)><br>
<p id="doC">Celcius: </p>
<script>
    function convert(degree) {
        let doF = document.getElementById("doF").value;
        let doC = (doF - 32) / 1.8;
        document.getElementById("doC").innerHTML = "Celcius: " + doC;
    }
</script>
</body>
</html>
