<script>
    let array = [2, -5, 5, 8, 3, 9, 11, -4];
    let min = array[0];

    function findMin(array) {
        if (array.length == 0) {
            return -1;
        }
        for (let i = 1; i < array.length; i++) {
            if (array[i] < min) {
                min = array[i];
            }
        }
        return min;
    }

    findMin(array);
    alert(min)
</script>
