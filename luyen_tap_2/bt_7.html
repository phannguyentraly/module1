<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function swap() {
        let array = new Array(2);
        for (let i = 0; i < array.length; i++) {
            array[i] = +prompt(`Nhập số nguyên bất kì thứ ${i + 1}`);
        }
        array.reverse();
        alert(array);
    }

    swap();
</script>
</body>
</html>
