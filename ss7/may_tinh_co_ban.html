<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Máy tính</title>
</head>
<body>
<h1>Calculator</h1>
<input id="a"></input>
<input id="b" style="margin-bottom: 10px;"></input><br>
<button onclick="addition()">Addition(+)</button>
<button onclick="subtraction()">Subtraction(-)</button>
<button onclick="multiplication()">Multiplication(*)</button>
<button onclick="division()">Division(/)</button>
<p id="result"></p>
<script>
  function addition(){
   let a = +document.getElementById("a").value;
   let b = +document.getElementById("b").value;
   let c = a+b
    document.getElementById("result").innerHTML="Result Addition: "+c;
  }
  function subtraction(){
   let a = +document.getElementById("a").value;
   let b = +document.getElementById("b").value;
   let c = a-b
    document.getElementById("result").innerHTML="Result Subtraction: "+c;
  }
  function multiplication(){
   let a = +document.getElementById("a").value;
   let b = +document.getElementById("b").value;
   let c = a*b
    document.getElementById("result").innerHTML="Result Multiplication: "+c;
  }
  function division(){
   let a = +document.getElementById("a").value;
   let b = +document.getElementById("b").value;
   let c = a/b
    document.getElementById("result").innerHTML="Result Division: "+c;
  }
</script>
</body>
</html>
