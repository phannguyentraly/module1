<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let array = [
        [1, 2, 3, 4],
        [5, 8, 7, 9],
        [0, 7, 6, 9],
        [31, 12, 11, 10]
    ];
    for(let i=0; i < array.length; i++){
        document.write(`row ${i} <br>`);
        for(let j=0; j < array[i].length; j++){
            document.write(array[i][j]);
            document.write("<br>");
        }
    }
</script>
</body>
</html>
