<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    // nhập mảng
    function kyTu() {
        let n = prompt("Số ký tự trong mảng");
        let array = new Array(n);
        for (i = 0; i < n; i++) {
            array[i] = +prompt(`Nhập kí tự thứ ${i + 1}`)
        }
        // check
        let countFalse = 0;
        for (i = 0; i < array.length; i++) {
            if (array[i] % 1 != 0) {
                countFalse++;
            }
        }
        if (countFalse === 0) {
            alert("Mảng chỉ chứa ký tự số");
        } else if (countFalse === array.length) {
            alert("Mảng chỉ chứa ký tự chữ");
        } else if (countFalse < n) {
            alert("Mảng chứa cả ký tự chữ và số");
        }
    }

    kyTu();
</script>
</body>
</html>
