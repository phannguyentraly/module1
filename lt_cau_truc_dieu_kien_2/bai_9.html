<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  let a = +prompt("Nhập cạnh 1: ");
  let b = +prompt("Nhập cạnh 2: ");
  let c = +prompt("Nhập cạnh 3: ");
  if (a > 0 || b > 0 || c > 0) {
    if (a + b > c && a + c > b && b + c > a) {
      alert("Đây là 3 cạnh tam giác");
    } else {
      alert("Đây không phải 3 cạnh tam giác");
    }
  } else {
    alert("Đây không phải 3 cạnh tam giác");
  }
</script>
</body>
</html>
