<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  let test = +prompt("Nhập điểm kiểm tra: ");
  let midterm = +prompt("Nhập điểm giữa kì: ");
  let endterm = +prompt("Nhập điểm cuối kì: ");
  let diemTrungBinh = (test + midterm * 2 + endterm * 3) / 6;
  if (diemTrungBinh >= 8) {
    alert("Học lực giỏi");
  } else if (diemTrungBinh >= 6) {
    alert("Học lực khá")
  } else if (diemTrungBinh >= 5) {
    alert("Học lực trung bình")
  } else {
    alert("Học lực yếu")
  }
</script>
</body>
</html>
