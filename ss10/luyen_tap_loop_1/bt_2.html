<script>
    let nhietDo= +prompt("Nhập nhiệt độ hiện tại: ");
    while(nhietDo>100){
        nhietDo = +prompt("Giảm nhiệt độ: ")
    }
    while(nhietDo<20){
        nhietDo = +prompt("Tăng nhiệt độ: ")
    }
    alert("Đạt nhiệt độ phù hợp")
</script>
