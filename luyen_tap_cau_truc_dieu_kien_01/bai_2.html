<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<label>Nhập số tuổi</label>
<input id="age"><br>
<button onclick="kiemTra()">Kiểm tra</button><br>
<p id="result"></p>
<script>
  function kiemTra() {
    let age = +document.getElementById("age").value;
    if (age >= 15) {
      document.getElementById("result").innerHTML = "Đủ điều kiện học lớp 10";
    } else {
      document.getElementById("result").innerHTML = "Không đủ điều kiện học lớp 10";
    }
  }
</script>
</body>
</html>
