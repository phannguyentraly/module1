<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function reverse() {
        let array = new Array(5);
        for (let i = 0; i < array.length; i++) {
            array[i] = +prompt(`Nhập số nguyên thứ ${i + 1}: `);
        }
        array.reverse();
        alert(array);
    }

    reverse();
</script>
</body>
</html>
