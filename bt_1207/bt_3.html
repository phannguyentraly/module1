<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function checkPrime() {
        let n = +prompt("Có bao nhiêu số trong mảng");
        let array = new Array(n);
        for (let i = 0; i < n; i++) {
            array[i] = +prompt(`Nhập số nguyên thứ ${i + 1}`);
            // không phải số nguyên thì nhập lại
            while (array[i] % 1 != 0) {
                array[i] = prompt(`Nhập lại số nguyên thứ ${i + 1}`);
            }
        }
        // check có phải số nguyên tố
        let count = 0;
        let check = true;
        for (let i = 0; i < array.length; i++) {
            if (array[i] == 0 || array[i] == 1) {
                check = false;
                break;
            } else {
                for (let j = 2; j < array[i]; j++) {
                    if (array[i] % j === 0) {
                        count++;
                        check = false;
                        break;
                    }
                }
            }
        }
        alert(check);
    }

    checkPrime();
</script>
</body>
</html>
