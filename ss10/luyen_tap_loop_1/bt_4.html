<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let soDau = 0;
    let soSau = 1;
    let sum = soDau + soSau;
    while (sum % 5 != 0) {
        soDau = soSau;
        soSau = sum;
        sum = soDau + soSau;
    }
    alert(`Số đầu tiên trong dãy fibonacci chia hết cho 5 là: ${sum}`)
</script>
</body>
</html>
