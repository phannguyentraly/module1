<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let array = new Array(10);
    let i = 0
    for (; i < 10; i++) {
        array[i] = +prompt(`Số nguyên thứ ${i + 1} là: `);
    }
    array.sort(function (a, b) {
        return b - a;
    })
    alert(array);
</script>
</body>
</html>
