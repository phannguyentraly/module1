<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    for (let row = 1; row <= 9; row++) {
        for (let col = 2; col <= 9; col++) {
            let result = col * row;
            document.write(`${col}x${row}=${result} `);
        }
        document.write("<br>")
    }
</script>
</body>
</html>
