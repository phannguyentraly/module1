<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function check() {
        let char = prompt("Nhập ký tự");
        alert(typeof (char));
        if (isNaN(char)) {
            alert(`False`);
        } else {
            alert(`True`);
        }
    }
    check();
</script>
</body>
